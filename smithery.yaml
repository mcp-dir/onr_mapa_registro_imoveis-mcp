# Smithery configuration for ONR: Mapa do Registro de Imóveis
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_onr_mapa_registro_imoveis

name: onr_mapa_registro_imoveis-mcp
displayName: "ONR: Mapa do Registro de Imóveis"
description: >
  ONR: Mapa do Registro de Imóveis, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/onr_mapa_registro_imoveis-mcp
repository: https://github.com/mcp-dir/onr_mapa_registro_imoveis-mcp

tags:
  - onr_mapa_registro_imoveis
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_onr_mapa_registro_imoveis

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_onr_mapa_registro_imoveis/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
